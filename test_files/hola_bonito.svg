<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#FFA07A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#48C9B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5DADE2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#00000044"/>
    </filter>
  </defs>

  <!-- Fondo decorativo -->
  <rect width="800" height="300" rx="20" fill="#1a1a2e"/>
  
  <!-- Estrellas decorativas -->
  <circle cx="50" cy="40" r="2" fill="#ffffff88"/>
  <circle cx="150" cy="25" r="1.5" fill="#ffffff66"/>
  <circle cx="300" cy="50" r="2.5" fill="#ffffffaa"/>
  <circle cx="500" cy="30" r="1.8" fill="#ffffff77"/>
  <circle cx="650" cy="45" r="2" fill="#ffffff99"/>
  <circle cx="750" cy="20" r="1.5" fill="#ffffff55"/>
  <circle cx="100" cy="270" r="2" fill="#ffffff66"/>
  <circle cx="400" cy="260" r="1.8" fill="#ffffff88"/>
  <circle cx="700" cy="275" r="2.2" fill="#ffffff77"/>

  <!-- Texto principal HOLA con letras decorativas -->
  <text x="400" y="175" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="140" font-weight="bold" font-style="italic" fill="url(#grad1)" filter="url(#shadow)" letter-spacing="15">
    HOLA
  </text>

  <!-- Línea decorativa superior -->
  <path d="M 150 70 Q 250 50 400 70 Q 550 90 650 70" stroke="#FFD70088" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Línea decorativa inferior -->
  <path d="M 150 220 Q 250 240 400 220 Q 550 200 650 220" stroke="#5DADE288" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Corazoncitos decorativos -->
  <path d="M 120 150 C 120 140 130 130 140 140 C 150 130 160 140 160 150 C 160 165 140 175 140 175 C 140 175 120 165 120 150 Z" fill="#FF6B6B99"/>
  <path d="M 660 140 C 660 133 667 126 674 133 C 681 126 688 133 688 140 C 688 150 674 157 674 157 C 674 157 660 150 660 140 Z" fill="#FF6B6B99"/>
</svg>
