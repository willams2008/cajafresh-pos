<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Pieza 1: Panel frontal 300x150mm -->
  <rect id="Panel_Frontal" x="10" y="10" width="300" height="150" fill="none" stroke="#000" stroke-width="1"/>
  
  <!-- Pieza 2: Panel lateral 200x200mm -->
  <rect id="Panel_Lateral" x="320" y="10" width="200" height="200" fill="none" stroke="#000" stroke-width="1"/>
  
  <!-- Pieza 3: Base 400x250mm -->
  <rect id="Base" x="10" y="180" width="400" height="250" fill="none" stroke="#000" stroke-width="1"/>
  
  <!-- Pieza 4: Tapa 350x180mm -->
  <rect id="Tapa" x="420" y="220" width="350" height="180" fill="none" stroke="#000" stroke-width="1"/>
  
  <!-- Pieza 5: Refuerzo 120x80mm -->
  <rect id="Refuerzo" x="530" y="10" width="120" height="80" fill="none" stroke="#000" stroke-width="1"/>
  
  <!-- Pieza 6: Soporte 100x300mm -->
  <rect id="Soporte" x="10" y="450" width="100" height="300" fill="none" stroke="#000" stroke-width="1"/>
  
  <!-- Pieza 7: Divisor 250x60mm -->
  <rect id="Divisor" x="120" y="450" width="250" height="60" fill="none" stroke="#000" stroke-width="1"/>
</svg>
