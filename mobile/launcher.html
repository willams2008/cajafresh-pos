<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Fresh - Lanzador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-bg {
            0%, 100% { background-color: #eff6ff; }
            50% { background-color: #dbeafe; }
        }
        .animate-pulse-slow { animation: pulse-bg 3s infinite; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6 font-sans">
    <div class="max-w-sm w-full bg-white rounded-[2.5rem] shadow-2xl p-8 text-center border border-slate-100">
        <div class="w-20 h-20 bg-brand-600 rounded-3xl flex items-center justify-center text-white text-3xl mx-auto mb-6 shadow-lg shadow-brand-500/30">
            <i class="fas fa-glass-water"></i>
        </div>
        
        <h1 class="text-2xl font-black text-slate-800 mb-2">Caja Fresh</h1>
        <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-8">Conectando con el Servidor...</p>

        <div id="status-container" class="space-y-4">
            <div class="flex items-center justify-center gap-3 text-brand-600 font-bold animate-pulse">
                <i class="fas fa-satellite-dish"></i>
                <span id="status-text">Buscando enlace activo...</span>
            </div>
            
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-brand-500 h-full w-0 transition-all duration-500"></div>
            </div>
        </div>

        <div id="error-container" class="hidden mt-6 p-4 bg-red-50 rounded-2xl border border-red-100">
            <p class="text-xs text-red-600 font-bold mb-2">No se pudo encontrar el servidor.</p>
            <button onclick="discover()" class="text-[10px] font-black uppercase text-red-700 underline">Reintentar</button>
        </div>

        <p class="text-[10px] text-slate-400 mt-12 italic">Esta página siempre te llevará a la sesión de caja activa.</p>
    </div>

    <script>
        const TOPIC = 'zonafresh_caja_pos_tunnel_url_secret_eb6044';
        const progress = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');

        async function discover() {
            try {
                progress.style.width = '30%';
                // Consultar ntfy.sh para obtener el último mensaje enviado por la PC
                const response = await fetch(`https://ntfy.sh/${TOPIC}/json?poll=1&since=all`);
                const messages = await response.text();
                const lines = messages.trim().split('\n');
                
                if (lines.length > 0) {
                    const lastMsg = JSON.parse(lines[lines.length - 1]);
                    const data = JSON.parse(lastMsg.message);
                    
                    if (data.tunnelUrl) {
                        progress.style.width = '100%';
                        statusText.textContent = '¡Servidor Encontrado! Redirigiendo...';
                        setTimeout(() => {
                            window.location.href = data.tunnelUrl + '/mobile';
                        }, 500);
                        return;
                    }
                }
                throw new Error('No hay sesión activa');
            } catch (err) {
                console.error(err);
                progress.style.width = '0%';
                statusText.textContent = 'Servidor fuera de línea';
                document.getElementById('error-container').classList.remove('hidden');
            }
        }

        // Iniciar descubrimiento al cargar
        setTimeout(discover, 1000);
    </script>
</body>
</html>
